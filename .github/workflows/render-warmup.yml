name: Render Warmup

on:
  schedule:
    # Temporary verification mode: every 15 minutes all day (UTC).
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          set -euo pipefail
          curl -fsS "https://health-tracker-backend-z131.onrender.com/" > /dev/null
